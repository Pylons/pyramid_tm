[tox]
envlist =
    lint,
    py311,py312,py313,py314,py315,pypy311,
    py311-pyramid15,py311-pyramid110,
    py315-pyramid20,
    docs,
    coverage
isolated_build = True

[testenv]
deps =
    pyramid15: pyramid <= 1.5.99
    pyramid110: pyramid <= 1.10.99
    pyramid20: pyramid <= 2.0.99
    # pyramid_retry requires pyramid >= 1.9
    !pyramid15: pyramid_retry
    # pyramid < 2.1 imports pkg_resources, removed in setuptools 82
    pyramid15,pyramid110,pyramid20: setuptools < 82
commands =
    python --version
    pytest \
    cover: --cov \
        {posargs:}
dependency_groups =
    testing
setenv =
    COVERAGE_FILE=.coverage.{envname}

[testenv:coverage]
skip_install = True
commands =
    coverage combine
    coverage xml
    coverage report --fail-under=100
deps =
    coverage
dependency_groups =
setenv =
    COVERAGE_FILE=.coverage
depends = py314-cover

[testenv:lint]
skip_install = True
commands =
    isort --check-only --df src/pyramid_tm tests
    black --check --diff .
    check-manifest
    # flake8 src/pyramid_tm/ tests
    # build sdist/wheel
    python -m build .
    twine check dist/*
dependency_groups =
    lint

[testenv:docs]
allowlist_externals = make
commands =
    make -C docs html epub BUILDDIR={envdir}
dependency_groups =
    docs

[testenv:format]
skip_install = true
commands =
    isort src/pyramid_tm tests
    black .
dependency_groups =
    lint

[testenv:build]
skip_install = true
commands =
    # clean up build/ and dist/ folders
    python -c 'import shutil; shutil.rmtree("build", ignore_errors=True)'
    # Make sure we aren't forgetting anything
    check-manifest
    # build sdist/wheel
    python -m build .
    # Verify all is well
    twine check dist/*
dependency_groups =
    lint
